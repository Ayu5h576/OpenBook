name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --------------------------------------------------------------------------
  # Job 0: Secret scan — cheapest job, and the one that gates a leak.
  # Runs first and needs no npm install. See scripts/scan-secrets.sh for why
  # this exists (two live keys were once published from this repo).
  # --------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the tree as it stands; full history is not needed.
          fetch-depth: 1

      - name: Scan tracked files for credentials
        run: npm run scan:secrets

  # --------------------------------------------------------------------------
  # Job 1: TypeScript type-check (no transpilation needed)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma's generated types (LibraryStatus, ActivityType, Prisma.JsonObject,
      # …) do not exist until the client is generated, and tsc fails without them.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run lint

  # --------------------------------------------------------------------------
  # Job 2: Unit + Integration tests
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openbook
          POSTGRES_PASSWORD: openbook
          POSTGRES_DB: openbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://openbook:openbook@localhost:5432/openbook_test
      TEST_DATABASE_URL: postgresql://openbook:openbook@localhost:5432/openbook_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      API_PORT: 3099
      NODE_ENV: test
      APP_URL: http://localhost:3099

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

  # --------------------------------------------------------------------------
  # Job 3: Production build check
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secrets, lint, test]

    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      JWT_SECRET: build-check-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      API_PORT: 3000
      NODE_ENV: production
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
